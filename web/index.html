<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Suli POS - RAND SUITE | سیستەمی پێشکەوتووی خاڵی فرۆشتن و کۆگا">

  <!-- Mobile Viewport & Fullscreen Control -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14795F">
  <meta name="msapplication-navbutton-color" content="#14795F">
  <meta name="msapplication-TileColor" content="#14795F">
  <meta name="msapplication-TileImage" content="icons/Icon-192.png">
  <meta name="format-detection" content="telephone=no">

  <!-- iOS PWA Meta Tags & Icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Suli POS">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Android / Generic PWA -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Suli POS - RAND SUITE</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Prevent selection, pull-to-refresh & bounce on mobile */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0E1E1A;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-x pan-y;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Native App Launch Splash Screen */
    #pwa-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #14795F 0%, #092019 100%);
      z-index: 999999;
      color: #FFFFFF;
      transition: opacity 0.5s ease-out;
    }

    .splash-logo-container {
      position: relative;
      width: 110px;
      height: 110px;
      margin-bottom: 24px;
      animation: pulseLogo 2s infinite ease-in-out;
    }

    .splash-logo {
      width: 100%;
      height: 100%;
      border-radius: 26px;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.45);
    }

    .splash-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: #FFFFFF;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .splash-subtitle {
      font-size: 13px;
      font-weight: 500;
      color: #F0C46E;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .splash-spinner {
      width: 38px;
      height: 38px;
      border: 3.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #F0C46E;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <!-- Native Luxury Splash Screen shown before Flutter CanvasKit loads -->
  <div id="pwa-splash">
    <div class="splash-logo-container">
      <img class="splash-logo" src="icons/Icon-192.png" alt="Suli POS">
    </div>
    <div class="splash-title">Suli POS</div>
    <div class="splash-subtitle">RAND SUITE • سیستمێکی مۆدێرن و خێرا</div>
    <div class="splash-spinner"></div>
  </div>

  <script>
    // Remove splash screen once Flutter renders
    window.addEventListener('flutter-first-frame', function () {
      const splash = document.getElementById('pwa-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 500);
      }
    });

    // Fallback cleanup if event didn't fire within 8s
    setTimeout(function() {
      const splash = document.getElementById('pwa-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 500);
      }
    }, 8000);

    // Progressive Web App installation prompt helper
    let deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      window.pwaInstallPrompt = deferredInstallPrompt;
      console.log('Suli POS PWA is installable');
    });

    window.addEventListener('appinstalled', () => {
      window.pwaInstallPrompt = null;
      console.log('Suli POS was successfully installed as a native PWA');
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
